name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: 0xneves
        run: python today.py

      - name: Commit if SVGs changed
        run: |
          git config user.name "0xneves-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
          else
            git add cache/loc.json
            git commit -m "chore: update profile stats"
            git push
          fi
